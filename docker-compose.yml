version: '3.8'

services:
  animesonarrproxy:
    # Use pre-built image from GitHub Container Registry
    image: ghcr.io/warheadtaylor/animesonarrproxy:latest

    # OR build from source (comment out 'image' above and uncomment 'build' below)
    # build: .

    container_name: animesonarrproxy
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - API_KEY=${API_KEY:-your-secret-api-key-here}
      - HOST=0.0.0.0
      - PORT=8000
      - NYAA_URL=${NYAA_URL:-https://nyaa.si}
      - NYAA_NO_REMAKES=${NYAA_NO_REMAKES:-true}
      - NYAA_TRUSTED_ONLY=${NYAA_TRUSTED_ONLY:-false}
      - DATA_DIR=/app/data
      - ANIME_DB_UPDATE_INTERVAL=86400
      - CACHE_TTL=3600
      - MAX_RESULTS_PER_QUERY=100
      - TORZNAB_DEFAULT_LANGUAGE=${TORZNAB_DEFAULT_LANGUAGE:-English}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - anime-proxy-network

networks:
  anime-proxy-network:
    driver: bridge
